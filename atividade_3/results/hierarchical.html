<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hierarchical - Barrett II Eyes Clustering</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #2c3e50; }
        img { max-width: 100%; margin: 20px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Hierarchical Clustering (Ward)</h1>
        
        <h2>Dendrograma</h2>
        <img src="../imgs/dendrogram.png" alt="Dendrograma" style="max-width: 1000px;">
        
        <h2>Cluster Sizes</h2>
        <p>Cluster 0: 998 pontos | Cluster 1: 530 pontos</p>
        
        <h2>Metodo</h2>
